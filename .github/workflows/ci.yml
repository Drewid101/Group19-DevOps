name: CI

on:
  push:
    branches: [ master, Develop, Release ]
    paths-ignore:
      - README.md
      - PROJECT_SUMMARY.md
      - CONTRIBUTING.md
      - CONTRIBUTIONS.md
      - Code of Conduct.md
      - SECURITY.md
      - PRODUCT_BACKLOG.md
      - docs/**
      - .github/modernize/**
  pull_request:
    branches: [ master, Develop, Release ]
    paths-ignore:
      - README.md
      - PROJECT_SUMMARY.md
      - CONTRIBUTING.md
      - CONTRIBUTIONS.md
      - Code of Conduct.md
      - SECURITY.md
      - PRODUCT_BACKLOG.md
      - docs/**
      - .github/modernize/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: group19-delivery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-jar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run connection regression tests and build the executable JAR
        run: |
          mvn --batch-mode --no-transfer-progress clean package
          test -s target/semApp.jar
          jar tf target/semApp.jar > /dev/null
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-test-results
          path: target/surefire-reports
          if-no-files-found: error
          retention-days: 7
      - name: Upload the JAR
        uses: actions/upload-artifact@v7.0.2
        with:
          name: semApp-jar
          path: target/semApp.jar
          if-no-files-found: error
          retention-days: 7

  build-docker:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
    needs: build-jar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and test both containers
        run: |
          docker compose config --quiet
          docker compose build
          docker compose up --no-build --pull never --abort-on-container-exit --exit-code-from app
          mkdir -p generated-reports
          docker compose cp app:/app/reports/. generated-reports/
          sh scripts/verify-reports.sh generated-reports
      - name: Verify database failure does not report success
        run: sh scripts/test-connection-failure.sh
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove disposable test containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  build-candidates:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: application
            image: ghcr.io/drewid101/group19-devops-app
            context: .
            dockerfile: ./Dockerfile
          - component: database
            image: ghcr.io/drewid101/group19-devops-database
            context: ./db
            dockerfile: ./db/Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up QEMU for the application runtime stage
        if: matrix.component == 'application'
        uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the commit-addressed candidate
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  test-published:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [ build-jar, build-candidates ]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the published candidates without rebuilding
        # These aliases are local to the runner; no registry latest tag is changed here.
        run: |
          docker pull ghcr.io/drewid101/group19-devops-app:sha-${{ github.sha }}
          docker pull ghcr.io/drewid101/group19-devops-database:sha-${{ github.sha }}
          docker tag ghcr.io/drewid101/group19-devops-app:sha-${{ github.sha }} ghcr.io/drewid101/group19-devops-app:latest
          docker tag ghcr.io/drewid101/group19-devops-database:sha-${{ github.sha }} ghcr.io/drewid101/group19-devops-database:latest
          docker compose up --no-build --pull never --abort-on-container-exit --exit-code-from app
      - name: Verify database failure does not report success
        run: sh scripts/test-connection-failure.sh
      - name: Collect and validate the exact tested outputs
        run: |
          mkdir -p tested-output/reports
          docker compose cp app:/app/reports/. tested-output/reports/
          docker compose cp app:/app/app.jar tested-output/semApp.jar
          sh scripts/verify-reports.sh tested-output/reports
          test -s tested-output/semApp.jar
          unzip -tq tested-output/semApp.jar
          cp docker-compose.yml tested-output/
          tar -czf tested-output/reports.tar.gz -C tested-output reports
      - name: Check both published architectures exist
        run: |
          for image in ghcr.io/drewid101/group19-devops-app ghcr.io/drewid101/group19-devops-database; do
            docker buildx imagetools inspect --raw "$image:sha-${{ github.sha }}" |
              jq --exit-status '.manifests |
                (any(.[]; .platform.os == "linux" and .platform.architecture == "amd64") and
                 any(.[]; .platform.os == "linux" and .platform.architecture == "arm64"))'
          done
      - name: Upload tested outputs for the release job
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tested-output
          path: tested-output/
          if-no-files-found: error
          retention-days: 7
      - name: Promote only the accepted image manifests to latest
        run: |
          for image in ghcr.io/drewid101/group19-devops-app ghcr.io/drewid101/group19-devops-database; do
            docker buildx imagetools create --tag "$image:latest" "$image:sha-${{ github.sha }}"
            docker buildx imagetools inspect "$image:latest"
          done
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove disposable test containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  release:
    needs: test-published
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download the outputs from the accepted image
        uses: actions/download-artifact@v8.0.2
        with:
          name: tested-output
          path: tested-output
      - name: Validate downloaded reports
        run: sh scripts/verify-reports.sh tested-output/reports
      - name: Create a new release without rewriting existing tags
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('node:fs/promises');
            const { owner, repo } = context.repo;
            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: `build-${context.runId}-${{ github.run_attempt }}`,
              target_commitish: context.sha,
              name: `Population reports ${context.sha.slice(0, 7)}`,
              body: `JAR and 32 reports copied from accepted images tagged sha-${context.sha}.`,
              make_latest: 'true'
            });
            for (const name of ['semApp.jar', 'reports.tar.gz', 'docker-compose.yml']) {
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.data.id,
                name,
                headers: { 'content-type': 'application/octet-stream' },
                data: await fs.readFile(`tested-output/${name}`)
              });
            }
      - name: Publish verified reports without deleting other branch files
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: reports
          folder: tested-output/reports
          clean: false
          force: false
          single-commit: false
          git-config-name: "40869702"
          git-config-email: "332403145+40869702@users.noreply.github.com"
          commit-message: Publish verified reports for ${{ github.sha }}